services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: letsplay
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_MONGODB_URI: mongodb://letsplay:${MONGO_PASSWORD}@mongo:27017/letsplay?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ROOT_PASSWORD: ${ROOT_PASSWORD:?set ROOT_PASSWORD in .env}
      SSL_KEYSTORE_PATH: /app/certs/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?set SSL_KEYSTORE_PASSWORD in .env}
    ports:
      - "8443:8443"
    volumes:
      - certs:/app/certs
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  certs:
