jwt:
  secret: ${JWT_SECRET}
server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:${SSL_KEYSTORE_PATH:certs/keystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
spring:
  application:
    name: letsplay
  mongodb:
    uri: mongodb://localhost:27017/letsplay
  data:
    mongodb:
      # creates the unique index on users.email declared with @Indexed
      auto-index-creation: true
